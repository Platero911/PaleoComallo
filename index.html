<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paleoparque Comallo</title>

<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header>
    <h1>🦤 Paleoparque Comallo</h1>
    <p>Un viaje al pasado de nuestra Patagonia</p>
</header>

<section class="bienvenida">

    <img src="img/kelenken_mascota.png" alt="Kelenken">

    <div>
        <h2>Bienvenido explorador</h2>

        <p>
            Bienvenido al Paleoparque Comallo.
            Hoy los invitamos a realiar un viaje a través de millones de años de historia.
        </p>

        <div class="progreso">
            <div id="barra"></div>
        </div>

        <p id="textoProgreso">0 de 7 especies descubiertas</p>

        <button onclick="reiniciar()">Reiniciar recorrido</button>

    </div>

</section>

<section class="mapa-container">

    <img src="img/mapa.png" class="mapa">

    <button class="punto" style="top:82%; left:74%;" onclick="mostrar('proborhyeaena')"></button>

    <button class="punto" style="top:60%; left:90%;" onclick="mostrar('Astrapotherium')"></button>

    <button class="punto" style="top:34%; left:77%;" onclick="mostrar('kelenken')"></button>

    <button class="punto" style="top:14%; left:36%;" onclick="mostrar('argentavis')"></button>

    <button class="punto" style="top:65%; left:22%;" onclick="mostrar('smilodon')"></button>

    <button class="punto" style="top:86%; left:33%;" onclick="mostrar('notiomastodon')"></button>

    <button class="punto" style="top:47%; left:33%;" onclick="mostrar('purusaurus')"></button>

</section>

<div id="modal" class="modal">

    <div class="contenido">

        <span class="cerrar" onclick="cerrar()">&times;</span>

        <h2 id="titulo"></h2>

        <img id="imagenEspecie">

        <p id="descripcion"></p>

        <button id="btnDescubrir">
            Descubrir especie
        </button>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
